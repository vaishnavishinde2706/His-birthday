<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey - Forever Us</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- GSAP for scroll animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Audio element for journey music -->
    <audio id="journey-audio" style="display: none;"></audio>
    <nav class="global-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Forever Us</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="journey.html" class="nav-link active">Our Journey</a>
                <a href="memories.html" class="nav-link">Memories</a>
                <a href="poetry.html" class="nav-link">Poetry</a>
                <a href="secret.html" class="nav-link">Secret</a>
                <a href="letter.html" class="nav-link">Letter</a>
            </div>
        </div>
    </nav>

    <main class="container slide-up-fade" style="padding-top: 120px;">
        <!-- Music Control Button -->
        <button id="music-toggle" class="music-player-btn" aria-label="Toggle music" title="Play/Pause Music">
            <span class="music-icon">🎵</span>
        </button>

        <div class="text-center" style="margin-bottom: 60px;">
            <h1 class="text-script" style="font-size: 3.5rem;">Our Journey</h1>
            <p class="text-sub">Every love story is beautiful, but ours is my favorite.</p>
        </div>

        <div class="timeline" id="timeline-container">
            <div class="timeline-sticker" aria-label="Cute teddy bear sticker">🧸</div>
            <!-- Timeline items injected by JS -->
        </div>

        <div class="text-center" style="margin-top: 60px;">
            <a href="memories.html" class="btn interactive">See Our Memories</a>
        </div>
    </main>

    <footer class="global-footer">
        <span id="teddyEgg" class="teddy-easter-egg interactive">🧸</span>
    </footer>


    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/global-music-player.js"></script>
</body>
</html>
