<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Us</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- SweetAlert2 for cute alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <nav class="global-nav slide-up-fade">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Forever Us</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="journey.html" class="nav-link">Our Journey</a>
                <a href="memories.html" class="nav-link">Memories</a>
                <a href="poetry.html" class="nav-link">Poetry</a>
                <a href="secret.html" class="nav-link">Secret</a>
                <a href="letter.html" class="nav-link">Letter</a>
            </div>
        </div>
    </nav>

    <main class="container text-center" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-top: 100px;">
        <button id="music-toggle" class="music-player-btn" aria-label="Toggle music" title="Play/Pause Birthday Song">
            <span class="music-icon">🎵</span>
        </button>

        <h1 id="hero-title" class="fade-in text-script" style="font-size: 4rem; color: var(--c-text-dark);">Happy Birthday Onkyy❤️</h1>
        <p id="hero-subtitle" class="fade-in delay-1 text-sub" style="margin-bottom: 2rem;">To the one who makes every day brighter.</p>
        
        <div class="birthday-photo-scene fade-in delay-2">
            <div class="birthday-confetti" id="birthday-confetti" aria-hidden="true"></div>
            <div class="birthday-heart-shower" id="birthday-heart-shower" aria-hidden="true"></div>
            <div class="hero-image-wrap" style="max-width: 500px; margin: 0 auto; border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--shadow-soft);">
                <!-- Placeholder hero image, can be replaced -->
                <img src="assets/images/hero.jpeg" alt="Couple Image" style="width: 100%; display: block;">
            </div>
        </div>

        <div class="counter-widget fade-in delay-3">
            <div class="counter-item">
                <span class="counter-value" id="count-days">0</span>
                <span class="counter-label">Days</span>
            </div>
            <div class="counter-item">
                <span class="counter-value" id="count-hours">0</span>
                <span class="counter-label">Hours</span>
            </div>
            <div class="counter-item">
                <span class="counter-value" id="count-minutes">0</span>
                <span class="counter-label">Minutes</span>
            </div>
            <div class="counter-item">
                <span class="counter-value" id="count-seconds">0</span>
                <span class="counter-label">Seconds</span>
            </div>
        </div>
        <p class="fade-in delay-3" style="font-size: 0.9rem; color: var(--c-text-light); margin-top: 10px;">Together</p>

        <div style="margin-top: 40px;" class="fade-in delay-4">
            <a href="journey.html" class="btn btn-primary interactive">Begin Our Journey</a>
        </div>
    </main>

    <footer class="global-footer">
        <span id="teddyEgg" class="teddy-easter-egg interactive">🧸</span>
    </footer>


    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/global-music-player.js"></script>
    <script src="js/counter.js"></script>
    <script>
        // Set dynamic config text
        document.getElementById('hero-title').innerText = CONFIG.heroTitle;
        document.getElementById('hero-subtitle').innerText = CONFIG.heroSubtitle;

        // Birthday entrance effects only on initial load
        window.addEventListener('load', () => {
            const heartContainer = document.getElementById('birthday-heart-shower');
            const confettiContainer = document.getElementById('birthday-confetti');

            if (heartContainer) {
                const hearts = ['💖', '💗', '💕', '💞', '💘', '❤️'];
                for (let i = 0; i < 22; i++) {
                    const heart = document.createElement('span');
                    heart.className = 'heart-drop';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = `${Math.random() * 100}%`;
                    heart.style.setProperty('--dx', `${(Math.random() - 0.5) * 180}px`);
                    heart.style.animationDuration = `${4 + Math.random() * 2.5}s`;
                    heart.style.animationDelay = `${Math.random() * 0.8}s`;
                    heartContainer.appendChild(heart);
                }

                setTimeout(() => {
                    heartContainer.innerHTML = '';
                }, 6500);
            }

            if (confettiContainer) {
                const colors = ['#ff6fa8', '#ffd166', '#7bdff2', '#c7f9cc', '#b794f4'];
                for (let i = 0; i < 18; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'confetti-piece';
                    dot.style.left = `${Math.random() * 100}%`;
                    dot.style.top = `${Math.random() * 40 + 10}%`;
                    dot.style.background = colors[Math.floor(Math.random() * colors.length)];
                    dot.style.setProperty('--x', `${(Math.random() - 0.5) * 220}px`);
                    dot.style.setProperty('--y', `${Math.random() * 180 + 80}px`);
                    dot.style.animationDuration = `${1.8 + Math.random() * 1.3}s`;
                    dot.style.animationDelay = `${Math.random() * 0.5}s`;
                    confettiContainer.appendChild(dot);
                }

                setTimeout(() => {
                    confettiContainer.innerHTML = '';
                }, 3500);
            }
        });
    </script>
</body>
</html>
