<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Gallery - Forever Us</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/css/lightgallery.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/css/lg-zoom.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .gate-container {
            max-width: 400px;
            margin: 0 auto;
            background: var(--c-surface);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
        }
        .input-group {
            margin: 20px 0;
        }
        .input-group input {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid var(--c-primary);
            border-radius: 30px;
            font-family: var(--f-body);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            text-align: center;
        }
        .input-group input:focus {
            border-color: var(--c-secondary);
            box-shadow: 0 0 10px rgba(255, 193, 217, 0.3);
        }
        
        #secret-content {
            display: none;
        }

        .masonry-grid {
            column-count: 3;
            column-gap: 20px;
        }
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 20px;
            cursor: pointer;
        }
        @media (max-width: 900px) { .masonry-grid { column-count: 2; } }
        @media (max-width: 600px) { .masonry-grid { column-count: 1; } }
    </style>
</head>
<body>
    <nav class="global-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Forever Us</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="journey.html" class="nav-link">Our Journey</a>
                <a href="memories.html" class="nav-link">Memories</a>
                <a href="poetry.html" class="nav-link">Poetry</a>
                <a href="secret.html" class="nav-link active">Secret</a>
                <a href="letter.html" class="nav-link">Letter</a>
            </div>
        </div>
    </nav>

    <main class="container slide-up-fade" style="padding-top: 120px; min-height: 80vh;">
        
        <div id="password-gate" class="text-center">
            <h1 class="text-script" style="font-size: 3rem; margin-bottom: 20px;">Only My Love Knows This ❤️</h1>
            <div class="gate-container" id="gate-box">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--c-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <div class="input-group">
                    <input type="password" id="secret-password" placeholder="Enter password..." class="interactive">
                </div>
                <button id="unlock-btn" class="btn btn-primary interactive">Unlock Gallery</button>
            </div>
        </div>

        <div id="secret-content">
            <div class="text-center" style="margin-bottom: 60px;">
                <h1 class="text-script" style="font-size: 3.5rem;">Secret Gallery</h1>
                <p class="text-sub">Our private collection.</p>
            </div>
            <div id="secret-gallery" class="masonry-grid">
                <!-- Injected by JS -->
            </div>
            <div class="text-center" style="margin-top: 60px;">
                <a href="letter.html" class="btn interactive">Read My Letter</a>
            </div>
        </div>
    </main>

    <footer class="global-footer">
        <span id="teddyEgg" class="teddy-easter-egg interactive">🧸</span>
    </footer>


    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <!-- LightGallery JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/lightgallery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/plugins/zoom/lg-zoom.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/secret.js"></script>
</body>
</html>
